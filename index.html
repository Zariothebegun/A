  <!-- Camadas de fundo: Shader WebGL iridescente + Partículas iónicas -->
  <canvas id="gl-canvas" class="gl-canvas" aria-hidden="true"></canvas>
  <canvas id="ion-canvas" class="ion-canvas" aria-hidden="true"></canvas>
  <div class="bg-vignette" aria-hidden="true"></div>

  <!-- Sequência de arranque (Boot Overlay) -->
  <div class="boot-overlay" id="boot" role="status" aria-live="polite">
    <div class="boot-inner">
      <div class="boot-emblem" aria-hidden="true">
        <svg viewBox="0 0 120 120" class="boot-ring-svg">
          <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(94,234,212,0.18)" stroke-width="1.5" />
          <circle cx="60" cy="60" r="44" fill="none" stroke="#5eead4" stroke-width="2" stroke-dasharray="32 18" class="spin-slow" />
          <circle cx="60" cy="60" r="32" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="12 10" class="spin-rev" />
          <path d="M64 34L44 62h15l-4 24 21-28H61z" fill="#5eead4" />
        </svg>
      </div>
      <div class="boot-kicker">UNIDADE ELETROQUÍMICA // ANO 2087</div>
      <h1 class="boot-title">CÉLULA ZERO</h1>
      <div class="boot-bar-wrap">
        <div class="boot-bar" id="boot-bar"></div>
      </div>
      <div class="boot-meta">
        <span id="boot-status">A ligar o núcleo…</span>
        <button type="button" class="boot-skip" id="boot-skip">Saltar arranque →</button>
      </div>
    </div>
  </div>

  <!-- Barra de Comando Superior (HUD) -->
  <header class="hud" id="hud">
    <a href="#/" class="hud-brand" aria-label="Início — Célula Zero">
      <span class="hud-brand-mark">
        <svg class="ic"><use href="#ic-bolt"></use></svg>
      </span>
      <span class="hud-brand-text">
        <strong>CÉLULA ZERO</strong>
        <small>PROTOCOLO 2087</small>
      </span>
    </a>

    <nav class="hud-nav" aria-label="Navegação principal">
      <a href="#/hub" data-nav="hub"><svg class="ic"><use href="#ic-grid"></use></svg><span>Missões</span></a>
      <a href="#/lab" data-nav="lab"><svg class="ic"><use href="#ic-beaker"></use></svg><span>Simulador</span></a>
      <a href="#/codex" data-nav="codex"><svg class="ic"><use href="#ic-book"></use></svg><span>Arquivo</span></a>
      <a href="#/glossary" data-nav="glossary"><svg class="ic"><use href="#ic-glossary"></use></svg><span>Glossário</span></a>
      <a href="#/profile" data-nav="profile"><svg class="ic"><use href="#ic-award"></use></svg><span>Operador</span></a>
    </nav>

    <div class="hud-actions">
      <button type="button" class="hud-pill hud-guide-btn" id="guide-btn" title="Guião de Apresentação Nota 20">
        <svg class="ic"><use href="#ic-sparkles"></use></svg>
        <span class="hide-sm">Guião 20</span>
      </button>

      <button type="button" class="xp-chip" id="xp-chip" title="Ver Perfil e Certificado">
        <span class="xp-lvl" id="hud-lvl">NV 1</span>
        <span class="xp-info">
          <span class="xp-num" id="hud-xp">0 XP</span>
          <span class="xp-track"><span class="xp-fill" id="hud-xp-fill"></span></span>
        </span>
      </button>

      <button type="button" class="icon-btn" id="sound-btn" aria-label="Alternar som" title="Ativar/Desativar áudio sintetizado">
        <svg class="ic" id="sound-ic"><use href="#ic-sound"></use></svg>
      </button>
    </div>
  </header>

  <!-- Palco Principal SPA -->
  <main id="app" class="app-main" tabindex="-1"></main>

  <!-- Navegação Mobile Inferior -->
  <nav class="mobile-nav" id="mobile-nav" aria-label="Navegação móvel">
    <a href="#/hub" data-nav="hub"><svg class="ic"><use href="#ic-grid"></use></svg><span>Missões</span></a>
    <a href="#/lab" data-nav="lab"><svg class="ic"><use href="#ic-beaker"></use></svg><span>Simulador</span></a>
    <a href="#/codex" data-nav="codex"><svg class="ic"><use href="#ic-book"></use></svg><span>Arquivo</span></a>
    <a href="#/glossary" data-nav="glossary"><svg class="ic"><use href="#ic-glossary"></use></svg><span>Glossário</span></a>
    <a href="#/profile" data-nav="profile"><svg class="ic"><use href="#ic-award"></use></svg><span>Perfil</span></a>
  </nav>
